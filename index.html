<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappic — Real-Time Learning & Social Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #020d1a 0%, #041628 50%, #062040 100%);
      min-height: 100vh;
      color: #fff;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
    /* Loading animation */
    .loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 9999;
    }
    .loader-ocean {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 229, 255, 0.1);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      margin-top: 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: #7ac9e8;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <div class="loader-ocean"></div>
      <div class="loader-text">SNAPPIC</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
